[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "larry-threads-cli"
version = "0.1.0"
description = "Threads search, account inboxes and browser-backed text publishing"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "click>=8.1,<9",
  "curl-cffi>=0.13,<1",
  "opencc-python-reimplemented>=0.1.7,<1",
  "rich>=13,<15",
]

[project.scripts]
threads = "threads_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/threads_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
